name: TORCU Temporary NuGet Build

on:
  pull_request:
    branches: [master]

jobs:
  inspect-build-input:
    if: github.head_ref == 'torcu-build-temp-1717'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct prepared build input
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p prepared
          cat torcu-build/chunks/chunk_*.b64 | base64 --decode > /tmp/torcu-prepared.tar.xz
          xz -t /tmp/torcu-prepared.tar.xz
          tar -xJf /tmp/torcu-prepared.tar.xz -C prepared
          echo '=== PREPARED TREE ==='
          find prepared -maxdepth 4 -type f -printf '%p\n' | sort
          echo '=== BUILD FILES ==='
          find prepared -type f \( -name '*.sln' -o -name '*.csproj' -o -name '*.sh' -o -name '*.ps1' -o -name '*.md' \) -print | sort
      - name: Upload reconstructed input
        uses: actions/upload-artifact@v4
        with:
          name: torcu-prepared-input
          path: prepared
          if-no-files-found: error
          retention-days: 1
